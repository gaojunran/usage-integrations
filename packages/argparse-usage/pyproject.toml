[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usage-spec-argparse"
version = "1.2.0"
description = "Generates usage spec for CLIs written with argparse"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = ["argparse", "usage", "cli", "kdl", "shell-completion"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = ["usage-spec"]

[project.urls]
Repository = "https://github.com/gaojunran/usage-integrations"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/argparse_usage"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
